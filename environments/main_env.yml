name: main-env
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip
  - ipykernel

  # core
  - numpy
  - pandas
  - matplotlib
  - scikit-learn

  # pytorch
  - pytorch>=2.6
  - torchvision

  # COCO + imaging
  - pycocotools
  - pillow

  - opencv
  - libgl
  - glib

  - certifi

  - pip:
      - -e ..
      - transformers
      - iterative-stratification
      - ultralytics
